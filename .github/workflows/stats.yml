name: Refresh GitHub stats cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render stats cards
        # STATS_TOKEN is a classic PAT with repo + read:user; it is what makes private
        # contributions count. Without it the built-in token still works, public only.
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python .github/scripts/refresh_stats.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/github-stats.svg assets/top-langs.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-stats.svg assets/top-langs.svg
            git commit -m "chore: refresh GitHub stats cards"
            git push
          else
            echo "no changes"
          fi
